<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      color: var(--figma-color-text, #333);
      background: var(--figma-color-bg, #fff);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
    }

    /* Status area */
    .status {
      background: var(--figma-color-bg-secondary, #f5f5f5);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status .frame-name {
      font-weight: 600;
      font-size: 13px;
      display: block;
      margin-bottom: 2px;
    }

    .status .frame-info {
      font-size: 11px;
      color: var(--figma-color-text-secondary, #888);
    }

    .status.empty {
      color: var(--figma-color-text-tertiary, #aaa);
      font-style: italic;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-row .btn {
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--figma-color-bg-brand, #0d99ff);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--figma-color-bg-brand-hover, #0b85de);
    }

    .btn-secondary {
      background: var(--figma-color-bg-tertiary, #e8e8e8);
      color: var(--figma-color-text, #333);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--figma-color-bg-hover, #ddd);
    }

    .btn-export {
      background: #16a34a;
      color: #fff;
    }

    .btn-export:hover:not(:disabled) {
      background: #15803d;
    }

    /* Progress / feedback area */
    .progress {
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      line-height: 16px;
    }

    .progress.error {
      color: #dc2626;
    }

    .progress.success {
      color: #16a34a;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--figma-color-border, #e5e5e5);
      margin: 4px 0;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .option-row input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    /* Section detection thresholds */
    .num-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--figma-color-text-secondary, #888);
    }

    .num-row label { white-space: nowrap; }

    .num-row input[type="number"] {
      width: 100%;
      min-width: 0;
      flex: 1;
      height: 26px;
      padding: 0 6px;
      border: 1px solid var(--figma-color-border, #e5e5e5);
      border-radius: 4px;
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #333);
      font-family: inherit;
      font-size: 11px;
    }

    .num-row input[type="number"]:focus {
      outline: none;
      border-color: var(--figma-color-border-selected, #0d99ff);
    }

    /* Detected social icon rows */
    .detect-results {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .detect-results.show { display: flex; }

    .detect-row {
      border: 1px solid var(--figma-color-border, #e5e5e5);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detect-row-title {
      font-size: 11px;
      font-weight: 600;
    }

    .detect-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detect-cell .idx {
      font-size: 10px;
      opacity: 0.6;
      width: 12px;
      flex: none;
    }

    .detect-cell input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--figma-color-border, #e5e5e5);
      border-radius: 4px;
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #333);
      font-family: inherit;
      font-size: 11px;
    }

    .detect-cell input[type="text"]:focus {
      outline: none;
      border-color: var(--figma-color-border-selected, #0d99ff);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
    }

    .tab {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--figma-color-text-secondary, #888);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab.active {
      color: var(--figma-color-text, #333);
      border-bottom-color: var(--figma-color-bg-brand, #0d99ff);
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .panel.active {
      display: flex;
    }

    /* Email tab */
    #email-input {
      flex: 1;
      min-height: 120px;
      resize: none;
      width: 100%;
      padding: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--figma-color-text, #333);
      background: var(--figma-color-bg-secondary, #f5f5f5);
      border: 1px solid var(--figma-color-border, #e5e5e5);
      border-radius: 6px;
    }

    #email-input:focus {
      outline: none;
      border-color: var(--figma-color-bg-brand, #0d99ff);
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .field-row label {
      color: var(--figma-color-text-secondary, #888);
      white-space: nowrap;
    }

    .field-row input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 11px;
      color: var(--figma-color-text, #333);
      background: var(--figma-color-bg, #fff);
      border: 1px solid var(--figma-color-border, #e5e5e5);
      border-radius: 6px;
    }

    .field-row input[type="text"]:focus {
      outline: none;
      border-color: var(--figma-color-bg-brand, #0d99ff);
    }

    .stats {
      font-size: 11px;
      line-height: 1.6;
      background: var(--figma-color-bg-secondary, #f5f5f5);
      border-radius: 6px;
      padding: 10px;
      display: none;
    }

    .stats.show { display: block; }

    .stats .stat-line { display: flex; justify-content: space-between; }
    .stats .stat-line .val { font-weight: 600; }
    .stats .invalid-note {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--figma-color-border, #e5e5e5);
      color: #dc2626;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tab-slicer" data-panel="panel-slicer">Slicer</button>
    <button class="tab" id="tab-emails" data-panel="panel-emails">Emails</button>
  </div>

  <div class="panel active" id="panel-slicer">
  <div class="status empty" id="status">
    Select a frame to begin
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-generate" disabled>
      Generate Slices
    </button>
    <button class="btn btn-export" id="btn-export" disabled>
      Export HTML
    </button>
    <button class="btn btn-secondary" id="btn-ocr" disabled>
      Read text (OCR)
    </button>
    <div class="options">
      <label class="option-row">
        <input type="checkbox" id="chk-detect" checked />
        Auto-detect social icons
      </label>
      <label class="option-row">
        <input type="checkbox" id="chk-footer" checked />
        Add footer liquid tag
      </label>
    </div>
    <div class="divider"></div>
    <div class="num-row">
      <label for="num-gutter" title="A background gap this tall or taller becomes a section boundary.">Min gap</label>
      <input type="number" id="num-gutter" min="2" max="400" step="1" value="12" />
      <label for="num-section" title="Boundaries that would leave a section shorter than this are dropped.">Min section</label>
      <input type="number" id="num-section" min="4" max="2000" step="1" value="60" />
    </div>
    <div class="divider"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-clear-guides" disabled>
        Clear Guides
      </button>
      <button class="btn btn-secondary" id="btn-clear-slices" disabled>
        Clear Slices
      </button>
    </div>
  </div>

  <div class="detect-results" id="detect-results"></div>
  <div class="detect-results" id="alt-results"></div>

  <div class="progress" id="progress"></div>
  </div>

  <div class="panel" id="panel-emails">
    <textarea id="email-input" placeholder="Paste your email list here (one per line, or comma/semicolon separated). A header row is detected and skipped automatically."></textarea>

    <div class="field-row">
      <label for="email-filename">Save as</label>
      <input type="text" id="email-filename" />
    </div>

    <button class="btn btn-primary" id="btn-process-emails">Process &amp; Download CSV</button>

    <div class="stats" id="email-stats"></div>

    <div class="progress" id="email-progress"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script><!--@SLICER_CORE_BUNDLE@--></script>
  <script>
    // --- DOM References ---
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const btnGenerate = document.getElementById("btn-generate");
    const btnExport = document.getElementById("btn-export");
    const btnClearGuides = document.getElementById("btn-clear-guides");
    const btnClearSlices = document.getElementById("btn-clear-slices");
    const btnOcr = document.getElementById("btn-ocr");
    const chkDetect = document.getElementById("chk-detect");
    const detectResultsEl = document.getElementById("detect-results");
    const altResultsEl = document.getElementById("alt-results");
    const numGutter = document.getElementById("num-gutter");
    const numSection = document.getElementById("num-section");
    const allButtons = [btnGenerate, btnExport, btnOcr, btnClearGuides, btnClearSlices];

    let isValidSelection = false;
    let lastGenerateSummary = "";

    // --- Detection settings ---

    function readSetting(input, fallback) {
      const v = parseInt(input.value, 10);
      return Number.isFinite(v) && v > 0 ? v : fallback;
    }

    function pushSettings() {
      parent.postMessage({ pluginMessage: {
        type: "set-settings",
        minGutter: readSetting(numGutter, 12),
        minSection: readSetting(numSection, 60),
      } }, "*");
    }

    numGutter.onchange = pushSettings;
    numSection.onchange = pushSettings;

    // --- Button Click Handlers (UI -> Plugin) ---

    btnGenerate.onclick = () => {
      setAllButtonsDisabled(true);
      clearDetectResults();
      clearAltResults();
      lastGenerateSummary = "";
      setProgress("Analyzing frame...", "");
      parent.postMessage({ pluginMessage: {
        type: "generate-slices",
        detectSocial: chkDetect.checked,
      } }, "*");
    };

    btnOcr.onclick = () => {
      setAllButtonsDisabled(true);
      setProgress("Rendering slices...", "");
      parent.postMessage({ pluginMessage: { type: "ocr-slices" } }, "*");
    };

    btnExport.onclick = () => {
      setAllButtonsDisabled(true);
      setProgress("Starting export...", "");
      parent.postMessage({ pluginMessage: {
        type: "export-html",
        addFooter: document.getElementById("chk-footer").checked,
      } }, "*");
    };

    btnClearGuides.onclick = () => {
      parent.postMessage({ pluginMessage: { type: "clear-guides" } }, "*");
    };

    btnClearSlices.onclick = () => {
      parent.postMessage({ pluginMessage: { type: "clear-slices" } }, "*");
    };

    // --- Message Handler (Plugin -> UI) ---

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case "selection-changed":
          handleSelectionChanged(msg);
          break;

        case "settings":
          numGutter.value = msg.minGutter;
          numSection.value = msg.minSection;
          break;

        case "slices-generated":
          if (msg.cells && msg.cells.length > 0) {
            renderDetectResults({ found: true, cells: msg.cells, y0: msg.y0, y1: msg.y1 });
          } else {
            clearDetectResults();
          }
          // Icon detection reports after this and would otherwise overwrite the
          // slice count, so it is kept and re-used as a prefix there.
          lastGenerateSummary =
            (msg.sectionGuides ? "Proposed " + msg.sectionGuides + " guide(s), generated " : "Generated ") +
            msg.count + " slice(s).";
          setProgress(lastGenerateSummary, "success");
          enableButtonsIfValid();
          break;

        case "slice-images":
          await handleOcrSlices(msg);
          break;

        case "export-progress":
          setProgress("Exporting " + msg.current + "/" + msg.total + " slices...", "");
          break;

        case "detect-progress":
          setProgress(msg.message || "Scanning...", "");
          break;

        case "analyze-frame":
          setProgress("Analyzing frame...", "");
          await handleAnalyzeFrame(msg);
          break;

        case "detect-result":
          renderDetectResults(msg);
          enableButtonsIfValid();
          break;

        case "package-zip":
          await handlePackageZip(msg);
          break;

        case "slices-cleared":
          clearDetectResults();
          clearAltResults();
          setProgress("Slices cleared.", "");
          enableButtonsIfValid();
          break;

        case "guides-cleared":
          setProgress("Guides cleared.", "");
          enableButtonsIfValid();
          break;

        case "error":
          setProgress(msg.message, "error");
          enableButtonsIfValid();
          break;
      }
    };

    // --- Selection State ---

    function handleSelectionChanged(msg) {
      isValidSelection = msg.valid;
      if (msg.valid) {
        statusEl.className = "status";
        statusEl.innerHTML =
          '<span class="frame-name">' + escapeHtml(msg.frameName) + "</span>" +
          '<span class="frame-info">' + msg.frameWidth + " &times; " + msg.frameHeight +
          " &middot; " + msg.guideCount + " horizontal guide(s)</span>";
      } else {
        statusEl.className = "status empty";
        statusEl.textContent = "Select a frame to begin";
      }
      enableButtonsIfValid();
      setProgress("", "");
    }

    // --- Image Edge Color Extraction ---

    function loadImage(bytes) {
      return new Promise((resolve, reject) => {
        const blob = new Blob([new Uint8Array(bytes)], { type: "image/jpeg" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Failed to decode image")); };
        img.src = url;
      });
    }

    // ---- @slicer/core ----
    // Section detection, social-icon detection, colour sampling and HTML
    // generation live in packages/slicer-core and are bundled into this file at
    // build time (see esbuild.mjs). The web app imports the same module, so the
    // plugin and the app cannot drift apart.
    const {
      detectSectionOffsets,
      detectSocialBand,
      generateEmailHTML,
      groupSlicesIntoRows,
      averageColor,
      toHex,
      PLATFORM_URLS,
      SECTION_TUNING: { MAX_SECTION_CUTS },
    } = SlicerCore;

    async function loadImageToCanvas(bytes) {
      const img = await loadImage(bytes);
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      return { ctx, width: img.width, height: img.height };
    }

    async function extractEdgeColors(bytes) {
      const { ctx, width, height } = await loadImageToCanvas(bytes);
      const top = averageColor(ctx.getImageData(0, 0, width, 1));
      const bottom = averageColor(ctx.getImageData(0, height - 1, width, 1));
      return { top, bottom };
    }


    // ---- Entry point ----

    async function handleAnalyzeFrame(msg) {
      let band = msg.detectSocial
        ? { found: false, top: 0, bottom: 0, padTop: 0, padBottom: 0, cells: [] }
        : undefined;
      let sections = [];

      try {
        const { ctx, width, height } = await loadImageToCanvas(msg.bytes);
        const imageData = ctx.getImageData(0, 0, width, height);
        const scale = msg.scale;

        if (msg.detectSections) {
          sections = detectSectionOffsets(
            imageData,
            scale,
            msg.frameHeight,
            readSetting(numGutter, 12),
            readSetting(numSection, 60)
          );
          // A frame that produces this many boundaries is one where the
          // thresholds are wrong, not one with 60 sections — proposing them all
          // would bury the real structure and blow the slice cap downstream.
          if (sections.length > MAX_SECTION_CUTS) sections = [];
        }

        if (!msg.detectSocial) {
          parent.postMessage({ pluginMessage: { type: "frame-analysis", sections } }, "*");
          return;
        }

        const detected = detectSocialBand(imageData, scale, msg.frameWidth, msg.frameHeight);
        if (detected) band = detected;
      } catch (e) {
        band = msg.detectSocial
          ? { found: false, top: 0, bottom: 0, padTop: 0, padBottom: 0, cells: [] }
          : undefined;
        sections = [];
      }

      parent.postMessage({ pluginMessage: { type: "frame-analysis", band, sections } }, "*");
    }

    // --- Detection Results UI ---

    function clearDetectResults() {
      detectResultsEl.innerHTML = "";
      detectResultsEl.className = "detect-results";
    }

    function renderDetectResults(msg) {
      clearDetectResults();

      const prefix = lastGenerateSummary ? lastGenerateSummary + " " : "";

      if (!msg.found || !msg.cells || msg.cells.length === 0) {
        setProgress(prefix + "No social icon row found.", prefix ? "success" : "");
        return;
      }

      const box = document.createElement("div");
      box.className = "detect-row";

      const title = document.createElement("div");
      title.className = "detect-row-title";
      const origin = msg.usedExistingGuides === undefined
        ? ""
        : (msg.usedExistingGuides ? " · your guides" : " · guides added");
      title.textContent = msg.cells.length + " icons · y " + msg.y0 + "–" + msg.y1 + origin;
      box.appendChild(title);

      msg.cells.forEach((cell, i) => {
        const line = document.createElement("div");
        line.className = "detect-cell";

        const label = document.createElement("span");
        label.className = "idx";
        label.textContent = cell.platform ? cell.platform.slice(0, 2) : String(i + 1);
        label.title = cell.platform || "unidentified";
        line.appendChild(label);

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = (cell.platform && PLATFORM_URLS[cell.platform]) || "https://…";
        // Already applied to the slice by the sandbox; shown so it is editable.
        if (cell.url) input.value = cell.url;
        input.onchange = () => {
          let url = input.value.trim();
          if (url && !/^https?:\/\//i.test(url)) {
            url = "https://" + url;
            input.value = url;
          }
          parent.postMessage({
            pluginMessage: { type: "set-slice-link", nodeId: cell.nodeId, url },
          }, "*");
        };
        line.appendChild(input);

        box.appendChild(line);
      });

      detectResultsEl.appendChild(box);
      detectResultsEl.className = "detect-results show";

      const named = msg.cells.filter(c => c.platform).length;
      const linked = msg.cells.filter(c => c.url).length;
      setProgress(
        prefix + "Found " + msg.cells.length + " icon(s)" +
        (named ? ", " + named + " identified" : "") +
        (linked ? ", " + linked + " linked from saved URLs" : "") + ".",
        "success"
      );
    }

    // ============================================================
    // OCR (alt text)
    //
    // The artwork in these emails is flattened, so the copy only exists as
    // pixels — there are no text nodes to read. Tesseract runs here in the
    // iframe, which is the only side of the plugin with a canvas and network
    // access. Results are treated as a draft: every line is editable before it
    // reaches the export, because OCR on display type is never clean.
    // ============================================================

    const TESSERACT_VERSION = "5.1.1";
    const TESSERACT_JS = "https://cdn.jsdelivr.net/npm/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js";
    const OCR_LANGS = "por+eng";
    const OCR_MIN_CONFIDENCE = 55;
    const OCR_MAX_CHARS = 120;
    const OCR_MAX_DIM = 4000;      // beyond this the 2x upscale stops paying off

    let ocrWorker = null;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("could not load " + src));
        document.head.appendChild(s);
      });
    }

    // Loaded on first use rather than at startup: it is ~1MB of JS plus ~15MB of
    // language data, and most sessions never press the button.
    async function ensureOcrWorker() {
      if (ocrWorker) return ocrWorker;

      if (typeof Tesseract === "undefined") {
        setProgress("Downloading OCR engine...", "");
        await loadScript(TESSERACT_JS);
      }

      setProgress("Loading language data (first run downloads ~15MB)...", "");
      ocrWorker = await Tesseract.createWorker(OCR_LANGS, 1, {
        // Pinned explicitly so every fetch lands on a domain the manifest allows.
        workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@" + TESSERACT_VERSION + "/dist/worker.min.js",
        corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5",
        langPath: "https://tessdata.projectnaptha.com/4.0.0",
      });

      return ocrWorker;
    }

    // Upscaled, greyscaled, and flipped to dark-on-light when the slice is
    // mostly dark — light type on a dark card is the common case here and
    // Tesseract reads it far better the right way round.
    async function preprocessForOcr(bytes) {
      const img = await loadImage(bytes);
      const scale = Math.max(img.width, img.height) * 2 > OCR_MAX_DIM ? 1 : 2;

      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const px = frame.data;
      let sum = 0;
      for (let i = 0; i < px.length; i += 4) {
        const l = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        px[i] = px[i + 1] = px[i + 2] = l;
        sum += l;
      }

      if (sum / (px.length / 4) < 128) {
        for (let i = 0; i < px.length; i += 4) {
          const v = 255 - px[i];
          px[i] = px[i + 1] = px[i + 2] = v;
        }
      }

      ctx.putImageData(frame, 0, 0);
      return canvas;
    }

    function cleanOcrText(raw, confidence) {
      if (confidence < OCR_MIN_CONFIDENCE) return "";
      const text = String(raw || "").replace(/[\u0000-\u001f]+/g, " ").replace(/\s+/g, " ").trim();
      // Two stray glyphs off a photograph is noise, not a caption.
      const letters = text.match(/[\p{L}\p{N}]/gu);
      if (!letters || letters.length < 3) return "";
      return text.length > OCR_MAX_CHARS ? text.slice(0, OCR_MAX_CHARS - 1).trimEnd() + "…" : text;
    }

    async function handleOcrSlices(msg) {
      const slices = msg.slices || [];
      if (slices.length === 0) {
        setProgress("No slices to read.", "error");
        enableButtonsIfValid();
        return;
      }

      let worker;
      try {
        worker = await ensureOcrWorker();
      } catch (err) {
        setProgress(
          "OCR engine failed to load (" + err.message + "). Check manifest networkAccess.",
          "error"
        );
        enableButtonsIfValid();
        return;
      }

      const items = [];
      for (let i = 0; i < slices.length; i++) {
        const s = slices[i];
        setProgress("Reading text " + (i + 1) + "/" + slices.length + "...", "");
        let text = "";
        try {
          const canvas = await preprocessForOcr(s.bytes);
          const result = await worker.recognize(canvas);
          text = cleanOcrText(result.data.text, result.data.confidence);
        } catch (err) {
          text = "";
        }
        // An alt you already wrote or edited outranks a fresh guess.
        items.push({ nodeId: s.nodeId, name: s.name, alt: s.alt || text, ocr: text });
      }

      renderAltResults(items);

      // Persist the drafts so the export picks them up without a click each.
      for (const item of items) {
        if (item.alt) {
          parent.postMessage({
            pluginMessage: { type: "set-slice-alt", nodeId: item.nodeId, alt: item.alt },
          }, "*");
        }
      }

      const filled = items.filter(i => i.alt).length;
      setProgress(
        "Read " + filled + "/" + items.length + " slice(s). Edit before exporting.",
        filled > 0 ? "success" : ""
      );
      enableButtonsIfValid();
    }

    // --- Alt Text UI ---

    function clearAltResults() {
      altResultsEl.innerHTML = "";
      altResultsEl.className = "detect-results";
    }

    function renderAltResults(items) {
      clearAltResults();
      if (items.length === 0) return;

      const box = document.createElement("div");
      box.className = "detect-row";

      const title = document.createElement("div");
      title.className = "detect-row-title";
      title.textContent = "Alt text";
      box.appendChild(title);

      items.forEach((item, i) => {
        const line = document.createElement("div");
        line.className = "detect-cell";

        const label = document.createElement("span");
        label.className = "idx";
        label.textContent = String(i + 1);
        label.title = item.name;
        line.appendChild(label);

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "no text found";
        input.value = item.alt;
        input.onchange = () => {
          parent.postMessage({
            pluginMessage: { type: "set-slice-alt", nodeId: item.nodeId, alt: input.value },
          }, "*");
        };
        line.appendChild(input);

        box.appendChild(line);
      });

      altResultsEl.appendChild(box);
      altResultsEl.className = "detect-results show";
    }


    // --- Full Export Pipeline ---

    async function handlePackageZip(msg) {
      try {
        setProgress("Extracting colors...", "");

        // Extract edge colors for each slice
        const slicesWithColors = [];
        for (let i = 0; i < msg.slices.length; i++) {
          const s = msg.slices[i];
          const colors = await extractEdgeColors(s.bytes);
          slicesWithColors.push({
            fileName: s.fileName,
            width: s.width,
            height: s.height,
            absX: s.absX,
            absY: s.absY,
            linkUrl: s.linkUrl,
            alt: s.alt || "",
            colors: colors,
          });
        }

        setProgress("Generating HTML...", "");
        const htmlContent = generateEmailHTML(slicesWithColors, msg.addFooter);

        setProgress("Packaging ZIP...", "");
        const zip = new JSZip();
        zip.file("index.html", htmlContent);

        const imgFolder = zip.folder("images");
        for (const s of msg.slices) {
          imgFolder.file(s.fileName, new Uint8Array(s.bytes));
        }

        const blob = await zip.generateAsync({ type: "blob" });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = (msg.frameName || "email-export") + ".zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        setProgress("Export complete! ZIP downloaded.", "success");
      } catch (err) {
        setProgress("Error: " + err.message, "error");
      }
      enableButtonsIfValid();
    }

    // --- Helpers ---

    function setAllButtonsDisabled(disabled) {
      allButtons.forEach(b => (b.disabled = disabled));
    }

    function enableButtonsIfValid() {
      allButtons.forEach(b => (b.disabled = !isValidSelection));
    }

    function setProgress(text, className) {
      progressEl.textContent = text;
      progressEl.className = "progress" + (className ? " " + className : "");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // ============================================================
    // Tabs
    // ============================================================

    const tabs = document.querySelectorAll(".tab");
    const panels = document.querySelectorAll(".panel");
    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove("active"));
        panels.forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.panel).classList.add("active");
      };
    });

    // ============================================================
    // Email Formatter (ported from the "Format Emails" extension)
    // ============================================================

    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function isValidEmail(email) {
      return EMAIL_REGEX.test(email);
    }

    function processEmailContent(content) {
      const lines = content.split("\n");
      const validEmails = new Set();
      const invalidEntries = [];
      let totalEntriesProcessed = 0;

      // Skip the first line if it looks like a header (no "@")
      const startIndex = lines[0] && !lines[0].includes("@") ? 1 : 0;

      for (let i = startIndex; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        // Split by semicolon or comma to handle multiple emails per line.
        // Normalize each entry: lowercase, then strip wrapping quotes and any
        // whitespace/tabs around the value (e.g. `"  oscar@claro.com.br "`).
        const potentialEmails = line.split(/[;,]/).map(e =>
          e.trim().toLowerCase().replace(/^["']+|["']+$/g, "").trim()
        );
        for (const entry of potentialEmails) {
          if (!entry) continue;
          totalEntriesProcessed++;
          if (isValidEmail(entry)) {
            validEmails.add(entry);
          } else {
            invalidEntries.push({ line: i + 1, entry });
          }
        }
      }

      const outputLines = ["email,external_id"];
      for (const email of validEmails) {
        outputLines.push(email + "," + email);
      }

      const stats = {
        totalProcessed: totalEntriesProcessed,
        validUnique: validEmails.size,
        invalid: invalidEntries.length,
        duplicatesRemoved: totalEntriesProcessed - validEmails.size - invalidEntries.length,
        invalidEntries,
      };

      return { output: outputLines.join("\n"), stats };
    }

    function todayStamp() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return "" + y + m + day;
    }

    function setEmailProgress(text, className) {
      emailProgressEl.textContent = text;
      emailProgressEl.className = "progress" + (className ? " " + className : "");
    }

    const emailInput = document.getElementById("email-input");
    const emailFilenameInput = document.getElementById("email-filename");
    const emailStatsEl = document.getElementById("email-stats");
    const emailProgressEl = document.getElementById("email-progress");
    const btnProcessEmails = document.getElementById("btn-process-emails");

    // Default filename to today's date (YYYYMMDD.csv)
    emailFilenameInput.value = todayStamp() + ".csv";

    btnProcessEmails.onclick = () => {
      const content = emailInput.value;
      if (!content.trim()) {
        setEmailProgress("Nothing to process — paste an email list first.", "error");
        emailStatsEl.classList.remove("show");
        return;
      }

      const { output, stats } = processEmailContent(content);

      if (stats.validUnique === 0) {
        setEmailProgress("No valid emails found.", "error");
      } else {
        setEmailProgress("", "");
      }

      // Render stats
      let html =
        '<div class="stat-line"><span>Entries processed</span><span class="val">' + stats.totalProcessed + "</span></div>" +
        '<div class="stat-line"><span>Valid (unique)</span><span class="val">' + stats.validUnique + "</span></div>" +
        '<div class="stat-line"><span>Duplicates removed</span><span class="val">' + stats.duplicatesRemoved + "</span></div>" +
        '<div class="stat-line"><span>Invalid</span><span class="val">' + stats.invalid + "</span></div>";
      if (stats.invalidEntries.length > 0) {
        const invalidList = stats.invalidEntries.slice(0, 5).map(e => '"' + e.entry + '"').join(", ");
        const more = stats.invalidEntries.length > 5 ? " and " + (stats.invalidEntries.length - 5) + " more" : "";
        html += '<div class="invalid-note">Invalid: ' + escapeHtml(invalidList + more) + "</div>";
      }
      emailStatsEl.innerHTML = html;
      emailStatsEl.classList.add("show");

      if (stats.validUnique === 0) return;

      // Save the list — download as CSV
      let fileName = emailFilenameInput.value.trim() || todayStamp() + ".csv";
      if (!/\.csv$/i.test(fileName)) fileName += ".csv";

      const blob = new Blob([output], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      setEmailProgress("Saved " + fileName + " (" + stats.validUnique + " emails).", "success");
    };
  </script>
</body>
